spring.application.name=clothes-store-api

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clothes_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234567890}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

store.currency=${STORE_CURRENCY:inr}
store.frontend-url=${FRONTEND_URL:http://localhost:5173}
store.stripe.enabled=${STRIPE_ENABLED:true}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
